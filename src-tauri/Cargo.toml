[package]
name = "yuki-pet"
version = "0.1.0"
description = "Desktop pet following AI agent states"
edition = "2021"

[lib]
name = "yuki_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net"] }
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
