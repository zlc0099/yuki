<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>大小</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="panel">
  <div class="size-panel">
    <div class="size-head">
      <span>大小</span>
      <span class="size-val" id="val">50%</span>
      <button id="close" title="关闭">×</button>
    </div>
    <input id="scale" type="range" min="45" max="75" step="1" value="50" />
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
